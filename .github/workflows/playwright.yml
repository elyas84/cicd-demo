name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Database/Backend
          MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # App URLs
          BASE_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000/api
          NEXT_PUBLIC_UI: http://localhost:3000
          # Credentials (Add these to GitHub Secrets first!)
          VALID_EMAIL_ADMIN: ${{ secrets.VALID_EMAIL_ADMIN }}
          VALID_PASSWORD_ADMIN: ${{ secrets.VALID_PASSWORD_ADMIN }}
          VALID_EMAIL_USER: ${{ secrets.VALID_EMAIL_USER }}
          VALID_PASSWORD_USER: ${{ secrets.VALID_PASSWORD_USER }}
          NODE_ENV: test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
